# The CI gate: fixtures, Rust, the committed WASM artifact, lint, TypeScript, the test suites, and
# the runtime and package tests, on every PR and on every push to main.
#
# THE JOB IS NAMED `test` ON PURPOSE. The ruleset on `main` requires a status check with exactly
# that context before a PR can merge, and publish.yml's prepare phase auto-merges the release PR
# on that same check. Rename it and both break silently — the ruleset would wait forever for a
# check that never reports.
#
# `workflow_dispatch` is here because PRs opened with GITHUB_TOKEN never trigger `on: pull_request`
# (GitHub's anti-recursion rule); publish.yml dispatches this workflow against the release branch
# explicitly so the required check lands on the branch head.
#
# The C reference is never built here: tests consume the committed fixtures. Regenerating them
# (`yarn generate:fixtures`) needs an explicit H3 C checkout at the pinned revision.
name: Test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: "0.2.130"
  # Run the JavaScript actions themselves (checkout, setup-node, cache) on Node 24, not the runner's older default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (yarn 4)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      # rustup reads rust-toolchain.toml (1.99.1 + wasm32-unknown-unknown, rustfmt, clippy).
      - name: Set up Rust from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-wbg${{ env.WASM_BINDGEN_VERSION }}

      - name: Install wasm-bindgen-cli
        run: |
          if [ "$(wasm-bindgen --version 2>/dev/null)" != "wasm-bindgen ${WASM_BINDGEN_VERSION}" ]; then
            cargo install wasm-bindgen-cli --version "${WASM_BINDGEN_VERSION}" --locked --force
          fi

      - name: Check fixtures
        run: yarn check:fixtures

      # One version across npm and crates.io; publish.yml bumps them together.
      - name: Versions in lockstep
        run: |
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sister-h3") | .version')"
          NPM_VERSION="$(node -p "require('./package.json').version")"
          test "${CARGO_VERSION}" = "${NPM_VERSION}" || { echo "::error::Cargo.toml ${CARGO_VERSION} != package.json ${NPM_VERSION}"; exit 1; }

      - name: Rust format
        run: cargo fmt --all --check

      # The workspace build enables sister-h3's `libm` feature through the WASM adapter (feature
      # unification), so the default math path is linted and tested on its own.
      - name: Rust lint
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy -p sister-h3 --all-targets --locked -- -D warnings

      # Never `cargo test --workspace` here: it would test sister-h3 with the `libm` feature only.
      # H3_EXPECT_EXACT makes the suite fail if it is not comparing in the expected mode.
      - name: Rust tests (reference platform, bit-exact against the fixtures)
        run: H3_EXPECT_EXACT=1 cargo test -p sister-h3 --locked

      - name: Rust tests (libm feature, within documented bounds)
        run: H3_EXPECT_EXACT=0 cargo test -p sister-h3 --features libm --locked

      - name: Rust tests (WASM adapter)
        run: cargo test -p sister-h3-wasm --locked

      - name: Package the native crate
        run: cargo package -p sister-h3 --locked

      # Builds into a temporary directory and compares with the committed wasm/h3.wasm, glue, and
      # build manifest without overwriting them.
      - name: Committed WASM artifact matches a fresh build
        run: yarn check:wasm-artifact

      # Native with the `libm` feature must reproduce the WASM build bit for bit.
      - name: Native libm feature matches WASM exactly
        run: yarn check:libm-wasm

      - name: Lint
        run: yarn lint

      - name: Compile
        run: yarn compile

      - name: Type check
        run: yarn check-types

      # `--run` is required. Bare vitest watches and never exits.
      - name: Test
        run: yarn test --run

      # test:package runs the tarball under the floor of every engines.node range; setup-node above provides .nvmrc.
      - name: Install the engines floors for package tests
        run: |
          NVMRC="$(sed 's/^v//' .nvmrc)"
          FLOORS="$(node -p "require('./package.json').engines.node.split('||').map((r) => r.trim().replace(/^(\\^|>=)/, '')).join(' ')")"
          mkdir -p target/tools && cd target/tools
          for v in ${FLOORS}; do
            [ "${v}" = "${NVMRC}" ] && continue
            echo "installing Node ${v}"
            curl -fsSL -o "node-v${v}.tar.xz" "https://nodejs.org/dist/v${v}/node-v${v}-linux-x64.tar.xz"
            curl -fsSL "https://nodejs.org/dist/v${v}/SHASUMS256.txt" | grep " node-v${v}-linux-x64.tar.xz$" | sed "s/node-v${v}-linux-x64.tar.xz/node-v${v}.tar.xz/" | sha256sum -c -
            tar -xJf "node-v${v}.tar.xz"
          done

      - name: Package tests (npm tarball and native crate in clean consumers)
        run: yarn test:package

      - name: Install Chromium and Firefox for runtime tests
        run: yarn playwright-core install --with-deps chromium firefox

      - name: Runtime tests (Node, Worker bundle, wrangler dev, Vite and webpack in Chromium and Firefox)
        run: yarn test:runtimes

  # The native crate on platforms whose libm differs from the fixtures' (glibc on x86-64): parity
  # within documented bounds with the platform libm, and with the `libm` feature. Not a required
  # check; the `test` job above is.
  native:
    name: native (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS arm64, os: macos-26, target: "" }
          - { name: Linux arm64 glibc, os: ubuntu-24.04-arm, target: "" }
          - { name: Linux x86-64 musl, os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: Windows x86-64 MSVC, os: windows-latest, target: "" }
    env:
      H3_EXPECT_EXACT: "0"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust from rust-toolchain.toml
        run: |
          rustup show active-toolchain || rustup toolchain install
          if [ -n "${{ matrix.target }}" ]; then rustup target add "${{ matrix.target }}"; fi

      - name: Rust tests (platform libm)
        run: cargo test -p sister-h3 --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Rust tests (libm feature)
        run: cargo test -p sister-h3 --features libm --locked ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
