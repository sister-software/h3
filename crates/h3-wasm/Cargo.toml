[package]
name = "sister-h3-wasm"
description = "Internal WebAssembly adapter for @sister.software/h3. Not published."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The WebAssembly build always uses the portable libm, so native builds with the same feature reproduce it.
sister-h3 = { workspace = true, features = ["libm"] }
wasm-bindgen.workspace = true
